name: Deploy Vườn Nhỏ Của Ong to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bật pnpm qua Corepack
        run: corepack enable
      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile
      - name: Biên dịch website cho Pages
        env:
          VITE_PUBLIC_BASE: /web2/
        run: pnpm build
      - name: Đóng gói trang tĩnh
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Xuất bản GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
