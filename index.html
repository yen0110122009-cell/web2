  <script>
  (() => {
    "use strict";
    const STORAGE = "study-quest-standalone-v1";
    const DEFAULT_MASCOT = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" rx="120" fill="#fff5dd"/><path d="M53 143c-27-19-19-53 17-41m101 41c27-19 19-53-17-41" fill="#eaf5fa" stroke="#6e9bb1" stroke-width="6"/><path d="M78 113c-11-45 26-71 42-44 18-27 53-1 42 44" fill="#ffcf4f" stroke="#5b3d2c" stroke-width="6"/><ellipse cx="120" cy="143" rx="48" ry="55" fill="#f3c846" stroke="#5b3d2c" stroke-width="6"/><path d="M86 132h68M77 153h86M81 174h78" stroke="#503a2d" stroke-width="9"/><circle cx="103" cy="106" r="6" fill="#342a23"/><circle cx="139" cy="106" r="6" fill="#342a23"/><path d="M110 121c7 5 13 5 20 0" fill="none" stroke="#342a23" stroke-width="4" stroke-linecap="round"/><path d="M98 70c7-24 40-29 51-3-15-8-30-7-51 3" fill="#8f4a35"/><path d="M103 70c8-16 24-23 39-9" fill="none" stroke="#e891a0" stroke-width="9" stroke-linecap="round"/><path d="M108 64l-8-11m9 11l12-3" stroke="#e891a0" stroke-width="5" stroke-linecap="round"/><path d="M90 190c-17 8-27 21-31 37m92-37c17 8 27 21 31 37" fill="none" stroke="#5b3d2c" stroke-width="7" stroke-linecap="round"/></svg>`);
    const $ = (selector) => document.querySelector(selector);
    const escapeHTML = (text) => String(text ?? "").replace(/[&<>'\"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;","\"":"&quot;"}[char]));
    const uid = (prefix="id") => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    const localDate = (value=new Date()) => { const d = new Date(value); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
    const formatDate = (iso) => new Date(iso).toLocaleDateString("vi-VN",{weekday:"short",day:"numeric",month:"numeric"});
    const formatMinutes = (seconds) => seconds < 60 ? `${seconds} giây` : `${Math.round(seconds/60)} phút`;
    const blank = () => ({version:1,profile:{name:"Ong",dailyGoal:3},settings:{focusMinutes:25,noScore:false,reduceMotion:false,mascot:null,favorites:[]},sessions:[],topics:[],mistakes:[],oneThing:""});
    const validImage = (value) => typeof value === "string" && value.length < 650000 && /^data:image\/(png|jpeg|webp);base64,/i.test(value);
    const normalize = (raw) => { const d=blank(); if(!raw || typeof raw!=="object") return d; d.profile={...d.profile,...raw.profile}; d.settings={...d.settings,...raw.settings}; d.sessions=Array.isArray(raw.sessions)?raw.sessions.filter(s=>s&&s.id):[]; d.topics=Array.isArray(raw.topics)?raw.topics.filter(t=>t&&t.id):[]; d.mistakes=Array.isArray(raw.mistakes)?raw.mistakes.filter(m=>m&&m.id):[]; d.oneThing=typeof raw.oneThing==="string"?raw.oneThing:""; d.settings.mascot=validImage(d.settings.mascot)?d.settings.mascot:null; const seen=new Set(); d.settings.favorites=(Array.isArray(d.settings.favorites)?d.settings.favorites:[]).filter(f=>f&&f.id&&validImage(f.image)&&!seen.has(f.image)&&seen.add(f.image)).slice(0,3); return d; };
    let data; try{data=normalize(JSON.parse(localStorage.getItem(STORAGE)||"null"));}catch{data=blank()}
    let ui={page:"overview",modal:null,reason:"forgot",timer:{minutes:data.settings.focusMinutes||25,remaining:(data.settings.focusMinutes||25)*60,running:false,startedAt:null,subject:"Toán"},crop:{src:null,img:null,zoom:1,x:0,y:0}};
    let timerID=null;
    const save=()=>localStorage.setItem(STORAGE,JSON.stringify(data));
    const toast=(message)=>{const node=$("#toast");node.textContent=message;node.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>node.classList.remove("show"),2800)};
    const completed=()=>data.sessions.filter(s=>s.status==="completed");
    const todaySessions=()=>completed().filter(s=>localDate(s.endedAt)===localDate());
    const progress=()=>{const sessions=completed();const reward=sessions.filter(s=>!s.noScore);const totalSeconds=sessions.reduce((sum,s)=>sum+(Number(s.actualSeconds)||0),0);const xp=reward.reduce((sum,s)=>sum+Math.round((Number(s.actualSeconds)||0)/30),0);const daySet=[...new Set(sessions.map(s=>localDate(s.endedAt)))];let streak=0;let cursor=new Date();while(daySet.includes(localDate(cursor))){streak++;cursor.setDate(cursor.getDate()-1)}return{totalSeconds,xp,energy:Math.round(totalSeconds/900),level:Math.max(1,Math.floor(xp/90)+1),streak,today:todaySessions(),todaySeconds:todaySessions().reduce((sum,s)=>sum+(Number(s.actualSeconds)||0),0)}};
    const frameState=()=>{const p=progress();if(!completed().length)return{kind:"quiet",name:"Khung lặng lẽ",text:"Chờ một bước nhỏ"};if(p.todaySeconds>=7200)return{kind:"rest",name:"Khung nghỉ thở",text:"Mình đi chậm lại nhé"};if(data.settings.noScore)return{kind:"gentle",name:"Khung dịu nhẹ",text:"Không cần chấm điểm hôm nay"};if(p.today.length>=data.profile.dailyGoal)return{kind:"bloom",name:"Khung nở hoa",text:"Hôm nay Ong đã có mặt"};return{kind:"steady",name:"Khung vào nhịp",text:"Từng bước đang nối lại"}};
    const mascot=()=>validImage(data.settings.mascot)?data.settings.mascot:DEFAULT_MASCOT;
    const week=()=>Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const key=localDate(d);const seconds=completed().filter(s=>localDate(s.endedAt)===key).reduce((n,s)=>n+(Number(s.actualSeconds)||0),0);return{key,label:d.toLocaleDateString("vi-VN",{weekday:"short"}).replace("T.","T"),seconds,today:key===localDate()}});
    const reasonLabel={"unclear":"Không hiểu đề","forgot":"Quên kiến thức","calculation":"Tính sai","misread":"Đọc nhầm","rushed":"Làm quá nhanh","method":"Chưa biết cách làm"};
    function mascotMarkup(){const p=progress(), f=frameState();return `<div class="mascot-zone"><div class="mascot-frame frame-${f.kind}"><div class="level-stamp">Lv.${p.level}<small>${p.energy} năng lượng</small></div><img src="${mascot()}" alt="Mascot nữ tính của Ong" /></div><div class="frame-note">${f.name}<span>${f.text}</span></div><p class="mascot-caption">“${p.today.length?"Mỗi phiên học làm thế giới lớn lên.":"Đi thôi, bắt đầu một phiên ngắn nhé!"}”</p><button class="link-button" data-action="open-mascot">⚙ MASCOT CỦA ONG</button></div>`}
    function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">🐝</div><div><strong>Study Quest</strong><small>HỌC HAY KHÔNG?</small></div></div><nav class="nav"><button class="${ui.page==="overview"?"active":""}" data-page="overview"><span class="nav-icon">▥</span><span>Tổng quan</span></button><button class="${ui.page==="deep"?"active":""}" data-page="deep"><span class="nav-icon">◉</span><span>Học sâu</span></button><button class="${ui.page==="journal"?"active":""}" data-page="journal"><span class="nav-icon">◷</span><span>Nhật ký học</span></button></nav><div class="side-note"><b>Local-first</b>Dữ liệu của Ong chỉ nằm trong trình duyệt này.</div></aside>`}
    function topbar(){return `<header class="topbar"><div class="date-line">${new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"})}<b>✦ Bắt đầu hành trình</b></div><div class="top-actions"><button class="icon-button" data-action="toggle-no-score" title="Bật/tắt No Score">${data.settings.noScore?"☁":"◎"}</button><button class="icon-button" data-action="open-settings" title="Cài đặt">⚙</button></div></header>`}
    function overview(){const p=progress();const running=ui.timer.running;const secs=Math.max(0,ui.timer.remaining);const time=`${String(Math.floor(secs/60)).padStart(2,"0")}:${String(secs%60).padStart(2,"0")}`;return `<div class="notice"><div><b>No Zero Day</b>${p.today.length?"Ong đã có một phiên hôm nay. Mình cứ nhẹ nhàng tiếp tục nhé.":"Chưa học hôm nay cũng không sao. Năm phút là một bước có thật."}</div><button data-action="quick" data-minutes="5">HỌC 5 PHÚT →</button></div><section class="hero"><div><p class="eyebrow">Nhật ký của Ong</p><h1>Hôm nay ${escapeHTML(data.profile.name)} muốn<br><em>tiến thêm</em> bao nhiêu bước?</h1><p class="lede">Không cần học thật nhiều. Chỉ cần bắt đầu một bước nhỏ, rồi để hành trình tự nối dài.</p></div>${mascotMarkup()}</section><section class="gateway"><button class="primary" data-action="scroll-timer"><span class="gateway-icon">▣</span><span><b>HỌC NGAY</b><small>Chọn thời lượng</small></span><span class="arrow">→</span></button><button data-action="quick" data-minutes="5"><span class="gateway-icon">◷</span><span><b>QUICK STUDY</b><small>5 phút, có việc sẵn</small></span><span class="arrow">→</span></button><button data-action="toggle-no-score"><span class="gateway-icon">☁</span><span><b>HỌC NHẸ</b><small>Không XP, không streak</small></span><span class="arrow">→</span></button><button data-page="deep"><span class="gateway-icon">◎</span><span><b>HỌC SÂU</b><small>Chủ đề &amp; trí nhớ</small></span><span class="arrow">→</span></button></section><section class="one-thing"><div><p class="eyebrow">One thing · hôm nay</p><strong>Chọn một việc nhỏ để quay lại trước.</strong><p>Không cần hoàn hảo; chỉ cần rõ điều mình sẽ làm tiếp.</p></div><input aria-label="Một điều nhỏ hôm nay" value="${escapeHTML(data.oneThing)}" placeholder="Ví dụ: ôn 3 công thức khí" data-input="oneThing" /></section><section class="grid"><article id="timerCard" class="card timer-card"><div class="section-head"><div><p class="eyebrow">Phiên tập trung</p><h2>Thắp sáng một vòng tròn</h2></div><span class="tag">${running?"ĐANG HỌC":"SẴN SÀNG"}</span></div><div class="timer-layout"><div class="clock"><div><strong>${escapeHTML(ui.timer.subject)}</strong><b>${time}</b><span>${data.settings.noScore?"Chế độ không chấm điểm":"Sẵn sàng bắt đầu"}</span></div></div><div class="timer-form"><label for="timerSubject">Môn học</label><select id="timerSubject" data-input="timer-subject"><option>Toán</option><option>Vật lý</option><option>Hóa học</option><option>Ngữ văn</option><option>Ngoại ngữ</option><option>Khác</option></select><label style="margin-top:14px">Thời lượng</label><div class="presets">${[5,15,25,45,60].map(m=>`<button class="preset ${ui.timer.minutes===m?"active":""}" data-action="preset" data-minutes="${m}">${m}'</button>`).join("")}</div><div class="timer-actions">${running?`<button class="button green" data-action="pause">❚❚ TẠM DỪNG</button><button class="button ghost" data-action="finish">✓ KẾT THÚC</button>`:`<button class="button" data-action="start">▷ BẮT ĐẦU</button>`}<button class="button ghost slim" data-action="reset-timer" title="Đặt lại">↻</button></div></div></div></article><aside class="card stats-card"><p class="eyebrow">Hôm nay</p><h2>Nhịp học của Ong</h2><div class="stats"><div><b>${Math.round(p.todaySeconds/60)}</b><span>phút đã học</span></div><div><b>${p.today.length}</b><span>phiên xong</span></div><div><b>${data.settings.noScore?"—":"+"+p.xp}</b><span>XP tích lũy</span></div></div><p class="comfort">${p.today.length?"Một bước đã được ghi nhận. Mình giữ nhịp vừa đủ thôi.":"Chưa cần hơn ai; một phiên ngắn là đủ để bắt đầu."}</p><div class="health-row"><span>Chuỗi ngày học</span><b>${p.streak} ngày</b></div></aside></section><section class="grid" style="margin-top:18px"><article class="card"><div class="section-head"><div><p class="eyebrow">Tuần này</p><h2>Nhịp học, không phải bảng điểm</h2></div><span class="tag">${Math.round(p.totalSeconds/60)} phút tổng</span></div><div class="week-bars">${week().map(d=>{const h=Math.max(5,Math.min(100,d.seconds/9));return `<div class="day-bar ${d.today?"today":""}"><b>${Math.round(d.seconds/60)}</b><span class="bar" style="height:${h}%"></span><span>${d.label}</span></div>`}).join("")}</div></article><article class="card"><div class="section-head"><div><p class="eyebrow">Lịch sử gần đây</p><h2>Dấu chân học tập</h2></div><button class="link-button" data-page="journal">XEM TẤT CẢ</button></div>${historyMarkup(4)}</article></section>`}
    function historyMarkup(limit=999){const rows=completed().slice().sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt)).slice(0,limit);if(!rows.length)return `<div class="empty">Khi Ong hoàn thành phiên đầu tiên, dấu chân học tập sẽ hiện ở đây.</div>`;return `<div class="history">${rows.map(s=>`<div class="history-row"><div class="history-symbol">${s.noScore?"☁":"✓"}</div><div><b>${escapeHTML(s.subject)}</b><span>${formatMinutes(s.actualSeconds)} · ${s.noScore?"Học nhẹ":"Phiên tập trung"}</span></div><time>${formatDate(s.endedAt)}</time></div>`).join("")}</div>`}
    function deep(){const topicCount={mastered:0,learning:0,fragile:0,unseen:0};data.topics.forEach(t=>topicCount[t.status] = (topicCount[t.status]||0)+1);const reasonCounts=Object.entries(reasonLabel).map(([key,label])=>({label,count:data.mistakes.filter(m=>m.reason===key).length})).filter(item=>item.count).sort((a,b)=>b.count-a.count);return `<p class="eyebrow">Học sâu</p><h1 class="page-title">Bộ não của Ong</h1><p class="page-subtitle">Những ô màu này chỉ phản ánh điều Ong đã tự ghi lại. Khi chưa đủ dữ liệu, web sẽ không kết luận thay bạn.</p><div class="memory-row"><div class="memory mastered"><b>${topicCount.mastered}</b>Đã nhớ tốt</div><div class="memory learning"><b>${topicCount.learning}</b>Đang nhớ</div><div class="memory fragile"><b>${topicCount.fragile}</b>Dễ quên</div><div class="memory unseen"><b>${topicCount.unseen}</b>Chưa học</div></div><section class="learning-grid"><article class="card"><div class="section-head"><div><p class="eyebrow">Knowledge library</p><h2>Các mảnh kiến thức</h2></div><span class="tag">${data.topics.length} chủ đề</span></div><form id="topicForm"><div class="form-grid"><div class="field"><label>Tên chủ đề</label><input required name="topic" placeholder="Ví dụ: Định luật Charles" /></div><div class="field"><label>Môn học</label><input required name="subject" placeholder="Ví dụ: Vật lý" /></div><div class="field full"><label>Kiến thức nền / ghi chú nhỏ</label><input name="note" placeholder="Ví dụ: nhiệt độ tuyệt đối, thể tích khí…" /></div></div><div class="form-actions"><button class="button slim" type="submit">+ THÊM CHỦ ĐỀ</button></div></form><div class="topic-list">${data.topics.length?data.topics.map(t=>`<div class="topic"><span class="topic-dot"></span><div class="topic-detail"><b>${escapeHTML(t.name)}</b><span>${escapeHTML(t.subject)}${t.note?" · "+escapeHTML(t.note):""}</span></div><select data-action="topic-status" data-id="${t.id}"><option value="unseen" ${t.status==="unseen"?"selected":""}>Chưa học</option><option value="learning" ${t.status==="learning"?"selected":""}>Đang nhớ</option><option value="fragile" ${t.status==="fragile"?"selected":""}>Dễ quên</option><option value="mastered" ${t.status==="mastered"?"selected":""}>Đã nhớ</option></select></div>`).join(""):`<div class="empty">Hãy thêm một chủ đề thật Ong đang học. Không có dữ liệu mẫu được tự tạo.</div>`}</div></article><aside class="card"><p class="eyebrow">Tại sao tôi sai?</p><h2>Ghi lại nguyên nhân</h2><p>Không phải để tự trách; đây là dấu vết để lần sau học đúng chỗ hơn.</p><form id="mistakeForm"><div class="field"><label>Chủ đề liên quan</label><select name="mistakeTopic">${data.topics.length?data.topics.map(t=>`<option value="${t.id}">${escapeHTML(t.name)}</option>`).join(""):`<option value="">Chưa có chủ đề</option>`}</select></div><div style="margin-top:11px" class="reason-grid">${Object.entries(reasonLabel).map(([key,label])=>`<button type="button" class="reason ${ui.reason===key?"selected":""}" data-action="reason" data-reason="${key}">${label}</button>`).join("")}</div><div class="form-actions"><button class="button slim" ${data.topics.length?"":"disabled"} type="submit">LƯU DẤU VẾT</button></div></form><div style="margin-top:18px"><p class="eyebrow">Từ dữ liệu đã ghi</p>${reasonCounts.length?reasonCounts.slice(0,3).map(item=>`<div class="mistake-stat"><b>${item.label}</b><span>${item.count} lần</span></div>`).join(""):`<div class="insight">Chưa có đủ dấu vết lỗi. Khi Ong tự lưu vài lần, phần này sẽ chỉ ra xu hướng nhẹ nhàng.</div>`}</div></aside></section>`}
    function journal(){const p=progress();const weak=data.topics.filter(t=>t.status==="fragile");return `<p class="eyebrow">Nhật ký hành trình</p><h1 class="page-title">Nhìn lại để biết mình cần gì</h1><p class="page-subtitle">Các con số chỉ là dấu vết của việc học, không phải thước đo giá trị của Ong.</p><section class="journal-top"><article class="card"><p class="eyebrow">Learning health</p><h2>Nhịp học hiện tại</h2><div class="health-row"><span>Thời gian đã lưu</span><b>${Math.round(p.totalSeconds/60)} phút</b></div><div class="health-row"><span>Chuỗi ngày học</span><b>${p.streak} ngày</b></div><div class="health-row"><span>Chủ đề dễ quên</span><b>${weak.length}</b></div><p class="comfort">${!completed().length?"Chưa có dữ liệu học. Điều đó cũng hoàn toàn ổn — mình có thể bắt đầu bằng 5 phút.":p.todaySeconds>=7200?"Ong đã học khá lâu hôm nay. Một khoảng nghỉ cũng là một phần của hành trình.":"Nhịp học đang được ghi lại. Mình tiếp tục bằng một mục tiêu vừa sức nhé."}</p></article><article class="card"><p class="eyebrow">Study backpack</p><h2>Mang theo một mảnh nhỏ</h2>${weak.length?`<p class="insight">Có ${weak.length} chủ đề Ong tự đánh dấu “dễ quên”: <b>${weak.slice(0,3).map(t=>escapeHTML(t.name)).join(", ")}</b>. Không cần giải quyết tất cả trong một lần.</p>`:`<div class="empty">Khi Ong đánh dấu một chủ đề “dễ quên”, nó sẽ nằm nhẹ nhàng trong ba lô ở đây.</div>`}<button class="button green slim" style="margin-top:14px" data-action="quick" data-minutes="5">BẮT ĐẦU 5 PHÚT</button></article></section><section class="grid" style="margin-top:18px"><article class="card"><div class="section-head"><div><p class="eyebrow">Study museum</p><h2>Lịch sử phiên học</h2></div><span class="tag">${completed().length} phiên</span></div>${historyMarkup()}</article><aside class="card"><p class="eyebrow">Dữ liệu của Ong</p><h2>Sao lưu nhẹ nhàng</h2><p>Tất cả dữ liệu lưu tại localStorage của trình duyệt. Ong có thể xuất một bản JSON để cất riêng.</p><div class="backup-row"><button class="button green slim" data-action="export">⇩ XUẤT JSON</button><button class="button ghost slim" data-action="import">⇧ NHẬP JSON</button><button class="button ghost slim" data-action="reset">↻ LÀM MỚI</button></div><p style="margin-top:18px" class="eyebrow">Thông tin cá nhân</p><button class="link-button" data-action="edit-name">ĐỔI TÊN HIỂN THỊ</button></aside></section>`}
    function modal(){if(!ui.modal)return "";if(ui.modal==="mascot"){const fav=data.settings.favorites||[];const active=data.settings.mascot;return `<div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Mascot của Ong"><div class="modal"><div class="modal-head"><div><p class="eyebrow">Mascot của Ong</p><h2>Chọn bạn đồng hành</h2></div><button class="close" data-action="close-modal" aria-label="Đóng">×</button></div><p>Ảnh được xử lý hoàn toàn trong trình duyệt trước khi lưu. Ong có thể giữ tối đa ba ảnh yêu thích để đổi nhanh.</p>${ui.crop.src?`<div class="crop-area"><div class="crop-preview"><img id="cropImg" src="${ui.crop.src}" alt="Xem trước ảnh mascot" style="transform:scale(${ui.crop.zoom}) translate(${ui.crop.x}px,${ui.crop.y}px)" /></div><label class="range-row">Thu phóng<input type="range" min="1" max="2.4" step="0.05" value="${ui.crop.zoom}" data-crop="zoom"><output>${Math.round(ui.crop.zoom*100)}%</output></label><label class="range-row">Ngang<input type="range" min="-40" max="40" value="${ui.crop.x}" data-crop="x"><output>${ui.crop.x}</output></label><label class="range-row">Dọc<input type="range" min="-40" max="40" value="${ui.crop.y}" data-crop="y"><output>${ui.crop.y}</output></label><div style="display:flex;justify-content:flex-end;gap:8px"><button class="button ghost slim" data-action="cancel-crop">HỦY ẢNH NÀY</button><button class="button slim" data-action="apply-crop">ÁP DỤNG &amp; LƯU</button></div></div>`:`<label class="upload-box"> <b>+ Tải ảnh từ thiết bị</b><span style="color:var(--muted);font-size:10px;margin:5px">PNG, JPG hoặc WebP · tối đa 7 MB</span><input id="mascotFile" type="file" accept="image/png,image/jpeg,image/webp" /></label>`}<section class="favorites"><div class="favorites-head"><b>♥ Bộ sưu tập của Ong</b><span>${fav.length}/3</span></div>${fav.length?`<div class="favorite-grid">${fav.map((f,i)=>`<div class="favorite ${f.image===active?"active":""}"><button class="choose" data-action="choose-favorite" data-id="${f.id}"><img src="${f.image}" alt="Mascot yêu thích ${i+1}"><span>${f.image===active?"Đang đồng hành":`Mascot ${i+1}`}</span></button><button class="delete-favorite" data-action="delete-favorite" data-id="${f.id}" aria-label="Xóa mascot yêu thích">×</button></div>`).join("")}</div>`:`<p style="margin:10px 0 0">Ảnh Ong áp dụng sẽ được tự lưu tại đây, đến tối đa ba ảnh.</p>`}</section><div style="display:flex;justify-content:space-between;align-items:center;margin-top:17px"><button class="link-button" data-action="default-mascot">KHÔI PHỤC MASCOT MẶC ĐỊNH</button><button class="button ghost slim" data-action="close-modal">XONG</button></div></div></div>`}if(ui.modal==="settings")return `<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><div><p class="eyebrow">Cài đặt</p><h2>Không gian học của Ong</h2></div><button class="close" data-action="close-modal">×</button></div><div class="field"><label>Mục tiêu phiên mỗi ngày</label><input id="dailyGoal" type="number" min="1" max="10" value="${data.profile.dailyGoal}"></div><div style="margin-top:15px"><label style="display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px"><input id="reduceMotion" type="checkbox" ${data.settings.reduceMotion?"checked":""}> Giảm chuyển động không cần thiết</label></div><div class="form-actions"><button class="button" data-action="save-settings">LƯU CÀI ĐẶT</button></div></div></div>`;return ""}
    function render(){document.documentElement.style.scrollBehavior=data.settings.reduceMotion?"auto":"smooth";const body=ui.page==="overview"?overview():ui.page==="deep"?deep():journal();$("#app").innerHTML=`<div class="app">${sidebar()}<main>${topbar()}<div class="content">${body}<p class="footer-note">Study Quest · Dữ liệu học của Ong được lưu cục bộ trên trình duyệt này.</p></div></main></div>${modal()}`;const select=$("#timerSubject");if(select)select.value=ui.timer.subject;bind();}
    function bind(){document.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>{ui.page=el.dataset.page;render()}));document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",handleAction));document.querySelectorAll("[data-input]").forEach(el=>el.addEventListener("input",e=>{if(e.target.dataset.input==="oneThing"){data.oneThing=e.target.value;save()}}));document.querySelectorAll("[data-crop]").forEach(el=>el.addEventListener("input",e=>{ui.crop[e.target.dataset.crop]=Number(e.target.value);render()}));const subject=$("#timerSubject");if(subject)subject.addEventListener("change",e=>ui.timer.subject=e.target.value);const topicForm=$("#topicForm");if(topicForm)topicForm.addEventListener("submit",addTopic);const mistakeForm=$("#mistakeForm");if(mistakeForm)mistakeForm.addEventListener("submit",addMistake);const file=$("#mascotFile");if(file)file.addEventListener("change",readMascot);const importFile=$("#importFile");if(importFile)importFile.onchange=readImport;document.querySelectorAll('[data-action="topic-status"]').forEach(el=>el.addEventListener("change",e=>{const topic=data.topics.find(t=>t.id===e.target.dataset.id);if(topic){topic.status=e.target.value;save();render()}}));}
    function handleAction(e){const action=e.currentTarget.dataset.action;if(action==="open-mascot"){ui.modal="mascot";render()}if(action==="open-settings"){ui.modal="settings";render()}if(action==="close-modal"){ui.modal=null;ui.crop={src:null,img:null,zoom:1,x:0,y:0};render()}if(action==="default-mascot"){data.settings.mascot=null;save();toast("Đã trở về mascot mặc định.");render()}if(action==="choose-favorite"){const fav=data.settings.favorites.find(f=>f.id===e.currentTarget.dataset.id);if(fav){data.settings.mascot=fav.image;save();toast("Đã đổi mascot đồng hành.");render()}}if(action==="delete-favorite"){const id=e.currentTarget.dataset.id;const removed=data.settings.favorites.find(f=>f.id===id);data.settings.favorites=data.settings.favorites.filter(f=>f.id!==id);if(removed&&data.settings.mascot===removed.image)data.settings.mascot=null;save();toast("Đã bỏ ảnh khỏi bộ sưu tập.");render()}if(action==="cancel-crop"){ui.crop={src:null,img:null,zoom:1,x:0,y:0};render()}if(action==="apply-crop")applyCrop();if(action==="preset"){setTimer(Number(e.currentTarget.dataset.minutes));render()}if(action==="quick"){setTimer(Number(e.currentTarget.dataset.minutes));startTimer();document.querySelector("#timerCard")?.scrollIntoView({behavior:"smooth",block:"center"})}if(action==="scroll-timer")document.querySelector("#timerCard")?.scrollIntoView({behavior:"smooth",block:"center"});if(action==="start")startTimer();if(action==="pause")pauseTimer();if(action==="finish")finishTimer();if(action==="reset-timer"){pauseTimer();setTimer(ui.timer.minutes);render()}if(action==="toggle-no-score"){data.settings.noScore=!data.settings.noScore;save();toast(data.settings.noScore?"Đang học nhẹ: phiên này không cộng XP hay streak.":"Đã tắt Học nhẹ.");render()}if(action==="reason"){ui.reason=e.currentTarget.dataset.reason;render()}if(action==="export")exportData();if(action==="import")$("#importFile").click();if(action==="reset")resetData();if(action==="edit-name"){const name=prompt("Ong muốn hiển thị tên gì?",data.profile.name);if(name&&name.trim()){data.profile.name=name.trim().slice(0,32);save();render()}}if(action==="save-settings"){data.profile.dailyGoal=Math.min(10,Math.max(1,Number($("#dailyGoal").value)||3));data.settings.reduceMotion=$("#reduceMotion").checked;save();ui.modal=null;toast("Đã lưu không gian học của Ong.");render()}}
    function setTimer(minutes){ui.timer.minutes=minutes;ui.timer.remaining=minutes*60;ui.timer.running=false;ui.timer.startedAt=null;clearInterval(timerID)}
    function startTimer(){if(ui.timer.running)return;ui.timer.running=true;ui.timer.startedAt=Date.now()-(ui.timer.minutes*60-ui.timer.remaining)*1000;clearInterval(timerID);timerID=setInterval(()=>{ui.timer.remaining=Math.max(0,ui.timer.remaining-1);render();if(ui.timer.remaining===0){finishTimer()}},1000);render()}
    function pauseTimer(){ui.timer.running=false;clearInterval(timerID);render()}
    function finishTimer(){const elapsed=Math.max(0,ui.timer.minutes*60-ui.timer.remaining);clearInterval(timerID);ui.timer.running=false;if(elapsed>0){data.sessions.push({id:uid("session"),subject:ui.timer.subject,startedAt:new Date(Date.now()-elapsed*1000).toISOString(),endedAt:new Date().toISOString(),actualSeconds:elapsed,status:"completed",noScore:Boolean(data.settings.noScore)});save();toast(data.settings.noScore?"Đã lưu phiên Học nhẹ, không cộng điểm.":"Đã lưu một phiên học thật. Ong làm tốt lắm.")}setTimer(ui.timer.minutes);render()}
    function addTopic(e){e.preventDefault();const f=new FormData(e.currentTarget);data.topics.push({id:uid("topic"),name:String(f.get("topic")).trim(),subject:String(f.get("subject")).trim(),note:String(f.get("note")).trim(),status:"learning",createdAt:new Date().toISOString()});save();toast("Đã thêm một mảnh kiến thức.");e.currentTarget.reset();render()}
    function addMistake(e){e.preventDefault();const f=new FormData(e.currentTarget);const topic=data.topics.find(t=>t.id===f.get("mistakeTopic"));if(!topic)return;data.mistakes.push({id:uid("mistake"),topicId:topic.id,reason:ui.reason,createdAt:new Date().toISOString()});save();toast("Đã lưu dấu vết, không phán xét.");render()}
    function readMascot(e){const file=e.target.files?.[0];if(!file)return;if(!["image/png","image/jpeg","image/webp"].includes(file.type)||file.size>7*1024*1024){toast("Hãy chọn PNG, JPG hoặc WebP dưới 7 MB nhé.");return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{ui.crop={src:reader.result,img:image,zoom:1,x:0,y:0};render()};image.src=reader.result};reader.readAsDataURL(file)}
    function applyCrop(){const image=ui.crop.img;if(!image)return;const canvas=document.createElement("canvas"),size=256;canvas.width=canvas.height=size;const ctx=canvas.getContext("2d");const source=Math.min(image.naturalWidth,image.naturalHeight)/ui.crop.zoom;const maxX=(image.naturalWidth-source)/2,maxY=(image.naturalHeight-source)/2;const sx=Math.max(0,Math.min(image.naturalWidth-source,(image.naturalWidth-source)/2+(ui.crop.x/40)*maxX));const sy=Math.max(0,Math.min(image.naturalHeight-source,(image.naturalHeight-source)/2+(ui.crop.y/40)*maxY));ctx.save();ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();ctx.drawImage(image,sx,sy,source,source,0,0,size,size);ctx.restore();const output=canvas.toDataURL("image/webp",.82);if(!validImage(output)){toast("Không thể tối ưu ảnh này. Hãy thử ảnh khác nhé.");return}data.settings.mascot=output;if(!data.settings.favorites.some(f=>f.image===output)&&data.settings.favorites.length<3)data.settings.favorites.unshift({id:uid("mascot"),image:output,createdAt:new Date().toISOString()});save();ui.crop={src:null,img:null,zoom:1,x:0,y:0};toast("Mascot mới đã được lưu vào bộ sưu tập.");render()}
    function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`study-quest-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast("Đã xuất bản sao lưu JSON.")}
    function readImport(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{data=normalize(JSON.parse(reader.result));save();toast("Đã khôi phục dữ liệu học của Ong.");render()}catch{toast("Tệp này không phải bản sao lưu Study Quest hợp lệ.")}};reader.readAsText(file);e.target.value=""}
    function resetData(){if(confirm("Làm mới toàn bộ dữ liệu local của Study Quest? Hãy xuất JSON trước nếu Ong muốn cất lại.")){data=blank();save();setTimer(25);toast("Đã làm mới không gian học. Mình bắt đầu thật nhẹ nhé.");render()}}
    render();
  })();
  </script>

    function home(){const x=p(),g=suggestion(),t=state.timer,clock=`${String(Math.floor(t.left/60)).padStart(2,"0")}:${String(t.left%60).padStart(2,"0")}`;return`<div class="sq-hero"><div><p class="sq-eye">Nhật ký của Ong</p><h1 class="sq-title">Hôm nay ${esc(data.profile.name)} muốn<br><em>tiến thêm</em> bao nhiêu bước?</h1><p class="sq-copy">Không cần học thật nhiều. Chỉ cần bắt đầu một bước nhỏ, rồi để hành trình tự nối dài.</p></div>${mascotMarkup()}</div><section class="sq-suggest"><div class="sq-spark">🐝</div><div><b>${g.title}</b><span>${g.text}</span></div><button class="sq-btn green slim" data-a="suggest" data-do="${g.action}">${g.label}</button></section><section class="sq-gateway"><button class="primary" data-a="focus"><span>▣</span><span><b>HỌC NGAY</b><small>Chọn thời lượng</small></span></button><button data-a="quick"><span>◷</span><span><b>QUICK STUDY</b><small>5 phút, có việc sẵn</small></span></button><button data-a="toggle-score"><span>☁</span><span><b>HỌC NHẸ</b><small>Không XP, không streak</small></span></button><button data-page="quest"><span>✦</span><span><b>QUEST</b><small>Đi theo một nhánh học</small></span></button></section><section class="sq-grid"><article class="sq-card" id="sqTimer"><div class="sq-section"><div><p class="sq-eye">Pomodoro linh hoạt</p><h2>${t.phase==="focus"?"Thắp sáng một vòng tròn":"Khoảng nghỉ nhỏ"}</h2></div><span class="sq-tag">${t.run?"ĐANG CHẠY":t.phase==="focus"?"SẴN SÀNG":"NGHỈ"}</span></div><div class="sq-timer"><div class="sq-clock"><div><strong>${esc(t.subject)}</strong><b>${clock}</b><span>${t.phase==="focus"?`${t.cycles?`Chu kỳ ${t.cycles+1} · `:""}${data.settings.noScore?"Học nhẹ":"Phiên tập trung"}`:"Hít thở · uống nước · nhìn xa"}</span></div></div><div><div class="sq-field"><label>Môn học</label><input id="subject" value="${esc(t.subject)}" placeholder="Ví dụ: Vật lý"></div><div class="sq-presets">${[5,15,25,45,50,60].map(m=>`<button class="sq-preset ${t.mins===m?"active":""}" data-a="preset" data-m="${m}">${m}'</button>`).join("")}</div><div class="sq-row"><div class="sq-field" style="width:112px"><label>Tùy chỉnh</label><input id="customMins" min="1" max="180" type="number" value="${t.mins}"></div><button class="sq-btn ghost slim" data-a="custom">ÁP DỤNG</button><label style="font-size:10px;color:var(--sq-muted)"><input id="cycle" type="checkbox" ${t.cycle?"checked":""}> Chu kỳ 25→nghỉ</label></div><div class="sq-row" style="margin-top:13px">${t.run?`<button class="sq-btn green" data-a="pause">❚❚ TẠM DỪNG</button><button class="sq-btn ghost" data-a="finish">✓ KẾT THÚC</button>`:`<button class="sq-btn" data-a="start">▷ BẮT ĐẦU</button>`}<button class="sq-btn ghost slim" data-a="reset">↻</button></div><div class="sq-audio"><div class="sq-field"><label>Không gian âm thanh</label><select id="audio">${Object.entries(soundName).map(([k,n])=>`<option value="${k}" ${data.settings.audio===k?"selected":""}>${n}</option>`).join("")}</select></div><button class="sq-btn ghost slim" data-a="preview">▶ NGHE THỬ</button></div></div></div></article><aside class="sq-card"><p class="sq-eye">Hôm nay</p><h2>Nhịp học của Ong</h2><div class="sq-stats"><div><b>${Math.round(x.todaySeconds/60)}</b><span>phút đã học</span></div><div><b>${x.today.length}</b><span>phiên xong</span></div><div><b>${data.settings.noScore?"—":"+"+x.xp}</b><span>XP có bằng chứng</span></div></div><p class="sq-note">XP chỉ đến từ phiên đủ 4 phút, Quest có ghi nhận và không tính ở Học nhẹ.</p><p class="sq-note">Chuỗi ngày: ${x.streak} ngày · Mục tiêu: ${data.profile.dailyGoal} phiên.</p></aside></section>`}
    function deep(){const counts={mastered:0,learning:0,fragile:0,unseen:0};data.topics.forEach(t=>counts[t.status]++);const bySubject={};data.topics.forEach(t=>(bySubject[t.subject||"Chưa phân môn"]??=[]).push(t));return`<p class="sq-eye">Học sâu</p><h1 class="sq-title">Bộ não của ${esc(data.profile.name)}</h1><p class="sq-copy">Những dấu vết ở đây do chính Ong ghi lại. Khi chưa đủ dữ liệu, Study Quest không kết luận thay Ong.</p><section class="sq-memory">${Object.entries(counts).map(([k,n])=>`<div class="mem-${k}"><b>${n}</b>${statusName[k]}</div>`).join("")}</section><section class="sq-grid"><article class="sq-card"><div class="sq-section"><div><p class="sq-eye">Knowledge library</p><h2>Mảnh kiến thức</h2></div><span class="sq-tag">${data.topics.length} mảnh</span></div><form id="topicForm"><div class="sq-form-grid"><div class="sq-field"><label>Tên chủ đề</label><input name="name" required placeholder="Ví dụ: Định luật II Newton"></div><div class="sq-field"><label>Môn học</label><input name="subject" required placeholder="Ví dụ: Vật lý"></div><div class="sq-field"><label>Khái niệm</label><input name="concept" placeholder="Ý chính Ong muốn nhớ"></div><div class="sq-field"><label>Công thức / quy tắc</label><input name="formula" placeholder="Nếu có"></div><div class="sq-field sq-full"><label>Ví dụ / ghi chú</label><textarea name="example" rows="2" placeholder="Một ví dụ của riêng Ong"></textarea></div></div><p style="text-align:right;margin:12px 0 0"><button class="sq-btn slim">+ THÊM MẢNH</button></p></form><div>${data.topics.length?data.topics.map(t=>{const errors=data.mistakes.filter(m=>m.topicId===t.id).length;return`<div class="sq-topic"><div class="sq-topic-head"><i class="sq-dot"></i><div><b>${esc(t.name)}</b><span>${esc(t.subject)} · ${statusName[t.status]} · ôn ${t.reviewCount||0} lần</span><div>${t.concept?`<span class="sq-chip">Khái niệm: ${esc(t.concept)}</span>`:""}${t.formula?`<span class="sq-chip">Quy tắc: ${esc(t.formula)}</span>`:""}${errors?`<span class="sq-chip">${errors} lỗi đã ghi</span>`:""}</div></div><select data-topic-status="${t.id}">${Object.entries(statusName).map(([k,n])=>`<option value="${k}" ${t.status===k?"selected":""}>${n}</option>`).join("")}</select></div><div class="sq-row" style="margin:8px 0 0 20px"><button class="sq-btn ghost slim" data-a="review" data-id="${t.id}">✓ ĐÃ ÔN LẠI</button>${t.example?`<span style="font-size:10px;color:var(--sq-muted)">${esc(t.example)}</span>`:""}</div></div>`}).join(""):`<div class="sq-empty">Hãy thêm một mảnh kiến thức thật Ong đang học. Không có dữ liệu mẫu được tự tạo.</div>`}</div></article><aside class="sq-card"><p class="sq-eye">Bản đồ lỗ hổng</p><h2>Nhìn để ôn đúng chỗ</h2><p class="sq-note">Màu đỏ chỉ là chủ đề Ong tự đánh dấu “dễ quên”, không phải đánh giá năng lực.</p><div class="sq-map">${Object.entries(bySubject).length?Object.entries(bySubject).map(([s,items])=>`<div class="sq-map-subject"><h3>${esc(s)}</h3>${items.map(t=>`<div class="sq-map-item ${t.status}"><span><i></i> ${esc(t.name)}</span><small>${data.mistakes.filter(m=>m.topicId===t.id).length} lỗi · ${t.reviewCount||0} lần ôn</small></div>`).join("")}</div>`).join(""):`<div class="sq-empty">Bản đồ sẽ xuất hiện khi Ong thêm chủ đề đầu tiên.</div>`}</div><hr style="border:0;border-top:1px dashed var(--sq-line);margin:18px 0"><p class="sq-eye">Tại sao tôi sai?</p><div class="sq-row">${[["unclear","Không hiểu đề"],["forgot","Quên kiến thức"],["calculation","Tính sai"],["misread","Đọc nhầm"],["rushed","Làm nhanh"],["method","Chưa biết cách"]].map(([k,n])=>`<button class="sq-btn ghost slim ${state.reason===k?"active":""}" data-a="reason" data-r="${k}">${n}</button>`).join("")}</div><form id="mistakeForm" style="margin-top:11px"><div class="sq-field"><label>Chủ đề liên quan</label><select name="topic">${data.topics.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")||"<option>Chưa có chủ đề</option>"}</select></div><p style="text-align:right"><button class="sq-btn slim" ${data.topics.length?"":"disabled"}>LƯU DẤU VẾT</button></p></form></aside></section>`}
    function questList(){const x=p(),weak=data.topics.filter(t=>t.status==="fragile"),mastered=data.topics.filter(t=>t.status==="mastered"),list=[];list.push({id:"start",icon:"🌱",title:"Bắt đầu bằng một phiên",text:"Hoàn thành một phiên tập trung ít nhất 4 phút.",done:x.sessions.some(s=>s.actualSeconds>=240),xp:10});weak.forEach(t=>list.push({id:"repair-"+t.id,icon:"🩹",title:"Quest sửa lỗ hổng: "+t.name,text:`${data.mistakes.filter(m=>m.topicId===t.id).length} lỗi đã ghi. Hãy ôn lại và tự ghi một bước kiểm tra.`,done:data.quests.some(q=>q.id==="repair-"+t.id&&q.done),xp:12,topic:t.id}));mastered.forEach(t=>list.push({id:"challenge-"+t.id,icon:"🔥",title:"Quest thử thách: "+t.name,text:"Viết một ví dụ hoặc tự giải thích theo cách của Ong.",done:data.quests.some(q=>q.id==="challenge-"+t.id&&q.done),xp:15,topic:t.id}));if(x.sessions.length>=3)list.push({id:"secret",icon:"🔒",title:"Quest bí mật đã mở",text:"Ong đã giữ nhịp 3 phiên. Ghi một điều bất ngờ về cách mình học.",done:data.quests.some(q=>q.id==="secret"&&q.done),xp:18});return list}
    function quests(){const x=p(),list=questList(),stage=Math.min(4,Math.floor((x.sessions.length+data.quests.filter(q=>q.done).length)/2));return`<p class="sq-eye">Study Quest</p><h1 class="sq-title">Đi theo một đường<br><em>học của riêng Ong</em></h1><p class="sq-copy">Sai không phải Game Over. Mỗi dấu vết có thể mở ra một nhánh sửa lỗ hổng hoặc thử thách phù hợp hơn.</p><section class="sq-quest-path">${[["🌱","Bắt đầu"],["📚","Làm quen"],["🧠","Hiểu nền"],["🔥","Thử thách"],["💎","Thành thạo"]].map(([i,n,k])=>`<div class="sq-stage ${k<=stage?"done":""}"><b>${i}</b>${n}</div>`).join("")}</section><section class="sq-grid"><article class="sq-card"><div class="sq-section"><div><p class="sq-eye">Quest có nhánh</p><h2>Điểm đến tiếp theo</h2></div><span class="sq-tag">${list.filter(q=>q.done).length}/${list.length} hoàn thành</span></div>${list.map(q=>`<div class="sq-quest ${q.done?"done":""}"><i>${q.done?"✓":q.icon}</i><div><b>${esc(q.title)}</b><span>${esc(q.text)}</span></div>${q.done?`<span class="sq-tag">+${q.xp} XP</span>`:`<button class="sq-btn slim" data-a="quest" data-id="${q.id}">GHI NHẬN</button>`}</div>`).join("")}</article><aside class="sq-card"><p class="sq-eye">XP có bằng chứng</p><h2>Không farm điểm</h2><p class="sq-note">Phiên dưới 4 phút vẫn được lưu, nhưng không nhận XP. Học nhẹ không cộng XP hoặc streak.</p><p class="sq-note">Quest chỉ được cộng sau khi Ong tự ghi nhận bước đã làm.</p><div class="sq-stats"><div><b>${x.xp}</b><span>XP</span></div><div><b>${x.level}</b><span>cấp độ</span></div><div><b>${data.quests.filter(q=>q.done).length}</b><span>quest đã ghi</span></div></div></aside></section>`}
    function journal(){const x=p(),last=x.sessions.slice().sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt))[0],backupDays=data.settings.backupAt?Math.floor((Date.now()-new Date(data.settings.backupAt))/86400000):99;return`<p class="sq-eye">Nhật ký hành trình</p><h1 class="sq-title">Nhìn lại để biết<br><em>mình cần gì</em></h1><p class="sq-copy">Nhật ký ghi lại điều Ong tự nhận ra — không phải bảng điểm và không thay Ong kết luận.</p><section class="sq-grid"><article class="sq-card"><div class="sq-section"><div><p class="sq-eye">Phiên gần nhất</p><h2>Hôm nay tôi đã học gì?</h2></div>${last?`<span class="sq-tag">${mins(last.actualSeconds)}</span>`:""}</div>${last&&!last.learned?`<form id="reflectForm"><div class="sq-field"><label>Hôm nay tôi đã học gì?</label><textarea name="learned" rows="2" placeholder="Ví dụ: hiểu lực ma sát không phải lúc nào cũng ngược chiều chuyển động"></textarea></div><div class="sq-field" style="margin-top:10px"><label>Tôi nhận ra điều gì?</label><textarea name="realized" rows="2" placeholder="Một điều nhỏ về cách học hoặc kiến thức"></textarea></div><p style="text-align:right"><button class="sq-btn slim">LƯU PHẢN CHIẾU</button></p></form>`:last?`<div class="sq-reflection"><b>Đã học:</b> ${esc(last.learned)}<br><b>Nhận ra:</b> ${esc(last.realized||"Chưa ghi")}</div>`:`<div class="sq-empty">Sau phiên học đầu tiên, Ong có thể viết một dòng về điều mình hiểu.</div>`}</article><aside class="sq-card"><p class="sq-eye">Sao lưu nhẹ nhàng</p><h2>Cất hành trình của Ong</h2><p class="sq-note">${backupDays>=14?`Ong chưa sao lưu ${backupDays===99?"lần nào":"trong "+backupDays+" ngày"}. Một tệp JSON có thể giúp cất hành trình riêng.`:"Bản sao lưu gần nhất còn mới. Dữ liệu vẫn chỉ ở trình duyệt này."}</p><div class="sq-row" style="margin-top:14px"><button class="sq-btn green slim" data-a="export">⇩ XUẤT JSON</button><button class="sq-btn ghost slim" data-a="import">⇧ NHẬP JSON</button><button class="sq-btn ghost slim" data-a="reset">↻ LÀM MỚI</button></div></aside></section><section class="sq-card" style="margin-top:18px"><div class="sq-section"><div><p class="sq-eye">Study museum</p><h2>Dấu chân học tập</h2></div><span class="sq-tag">${x.sessions.length} phiên</span></div><div class="sq-journal">${x.sessions.length?x.sessions.slice().sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt)).map(s=>`<div class="sq-session"><div class="sq-session-head"><b>${esc(s.subject)}</b><small>${new Date(s.endedAt).toLocaleDateString("vi-VN")} · ${mins(s.actualSeconds)} · ${s.noScore?"Học nhẹ":"+"+(s.xpAwarded||0)+" XP"}</small></div>${s.learned?`<div class="sq-reflection">${esc(s.learned)}${s.realized?`<br><small>Nhận ra: ${esc(s.realized)}</small>`:""}</div>`:""}</div>`).join(""):`<div class="sq-empty">Khi Ong hoàn thành phiên đầu tiên, dấu chân sẽ hiện ở đây.</div>`}</div></section>`}
    function settingsModal(){return`<div class="sq-modal-bg"><div class="sq-modal"><div class="sq-modal-head"><div><p class="sq-eye">Hồ sơ local-first</p><h2>Không gian học của Ong</h2></div><button class="sq-close" data-a="close">×</button></div><div class="sq-form-grid"><div class="sq-field"><label>Tên hiển thị</label><input id="pName" value="${esc(data.profile.name)}"></div><div class="sq-field"><label>Môn đang học</label><input id="pSubject" value="${esc(data.profile.currentSubject||"")}" placeholder="Ví dụ: Vật lý"></div><div class="sq-field"><label>Mục tiêu học</label><input id="pGoal" value="${esc(data.profile.goal||"")}"></div><div class="sq-field"><label>Phiên ưa thích</label><input id="pPref" min="1" max="180" type="number" value="${data.profile.preferred||25}"></div><div class="sq-field sq-full"><label>Thời gian thường học</label><input id="pTime" value="${esc(data.profile.usualTime||"")}" placeholder="Ví dụ: buổi tối"></div></div><p style="margin-top:14px"><label style="font-size:11px;color:var(--sq-muted)"><input id="pChatty" type="checkbox" ${data.settings.chatty?"checked":""}> Hiện lời thoại của mascot</label><br><label style="font-size:11px;color:var(--sq-muted)"><input id="pMotion" type="checkbox" ${data.settings.reduceMotion?"checked":""}> Giảm chuyển động không cần thiết</label></p><p style="text-align:right"><button class="sq-btn" data-a="save-settings">LƯU HỒ SƠ</button></p></div></div>`}
    function mascotModal(){const fav=data.settings.favorites||[];return`<div class="sq-modal-bg"><div class="sq-modal"><div class="sq-modal-head"><div><p class="sq-eye">Mascot của Ong</p><h2>Chọn bạn đồng hành</h2></div><button class="sq-close" data-a="close">×</button></div><p>Ảnh được xử lý trong trình duyệt trước khi lưu. Ong có thể giữ tối đa ba mascot yêu thích để đổi nhanh.</p>${state.crop.src?`<div class="sq-crop"><div class="sq-crop-preview"><img src="${state.crop.src}" style="transform:scale(${state.crop.zoom}) translate(${state.crop.x}px,${state.crop.y}px)"></div><div><label class="sq-range">Thu phóng<input data-crop="zoom" type="range" min="1" max="2.4" step=".05" value="${state.crop.zoom}"></label><label class="sq-range">Ngang<input data-crop="x" type="range" min="-40" max="40" value="${state.crop.x}"></label><label class="sq-range">Dọc<input data-crop="y" type="range" min="-40" max="40" value="${state.crop.y}"></label><div class="sq-row"><button class="sq-btn ghost slim" data-a="cancel-crop">HỦY</button><button class="sq-btn slim" data-a="apply-crop">ÁP DỤNG</button></div></div></div>`:`<div class="sq-field"><label>Tải ảnh PNG, JPG hoặc WebP (tối đa 7 MB)</label><input id="mascotUpload" type="file" accept="image/png,image/jpeg,image/webp"></div>`}<div style="margin-top:17px"><p class="sq-eye">Bộ sưu tập yêu thích · ${fav.length}/3</p>${fav.length?`<div class="sq-fav">${fav.map((f,i)=>`<button class="${f.image===data.settings.mascot?"active":""}" data-a="fav" data-id="${f.id}"><img src="${f.image}" alt="Mascot ${i+1}"><span>${f.image===data.settings.mascot?"Đang đồng hành":"Mascot "+(i+1)}</span></button>`).join("")}</div>`:`<div class="sq-empty">Khi Ong áp dụng một ảnh, ảnh đó sẽ tự vào bộ sưu tập.</div>`}</div><p style="display:flex;justify-content:space-between;margin-top:18px"><button class="sq-link" data-a="mascot-default">KHÔI PHỤC MẶC ĐỊNH</button><button class="sq-btn ghost slim" data-a="close">XONG</button></p></div></div>`}
    const modal=()=>state.modal==="settings"?settingsModal():state.modal==="mascot"?mascotModal():"";
    function render(){document.documentElement.style.scrollBehavior=data.settings.reduceMotion?"auto":"smooth";const page=state.page==="home"?home():state.page==="deep"?deep():state.page==="quest"?quests():journal();app.innerHTML=`<div class="sq2"><div class="sq-shell">${nav()}<main class="sq-main">${head()}<div class="sq-content">${page}<p style="margin:28px 0 0;text-align:center;color:var(--sq-muted);font-size:10px">Study Quest · Dữ liệu học của Ong được lưu cục bộ trong trình duyệt này.</p></div></main></div>${modal()}</div>`;bind()}
    const show=m=>{toastNode.textContent=m;toastNode.className="sq-toast show";clearTimeout(window.sqToast);window.sqToast=setTimeout(()=>toastNode.className="sq-toast",2800)};
    function bind(){app.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});app.querySelectorAll("[data-a]").forEach(b=>b.onclick=action);app.querySelectorAll("[data-topic-status]").forEach(s=>s.onchange=()=>{const t=data.topics.find(x=>x.id===s.dataset.topicStatus);if(t){t.status=s.value;save();render()}});app.querySelectorAll("[data-crop]").forEach(r=>r.oninput=()=>{state.crop[r.dataset.crop]=Number(r.value);render()});const a=document.getElementById("audio");if(a)a.onchange=()=>{data.settings.audio=a.value;save()};const f=document.getElementById("topicForm");if(f)f.onsubmit=addTopic;const m=document.getElementById("mistakeForm");if(m)m.onsubmit=addMistake;const r=document.getElementById("reflectForm");if(r)r.onsubmit=saveReflection;const up=document.getElementById("mascotUpload");if(up)up.onchange=readMascot}
    function action(e){const a=e.currentTarget.dataset.a;if(a==="settings"){state.modal="settings";render()}else if(a==="mascot"){state.modal="mascot";render()}else if(a==="close"){state.modal=null;state.crop={src:null,img:null,zoom:1,x:0,y:0};render()}else if(a==="toggle-score"){data.settings.noScore=!data.settings.noScore;save();show(data.settings.noScore?"Đang học nhẹ: không cộng XP hay streak.":"Đã tắt Học nhẹ.");render()}else if(a==="focus")document.getElementById("sqTimer")?.scrollIntoView({behavior:"smooth",block:"center"});else if(a==="quick"){setTime(5);start()}else if(a==="suggest"){const d=e.currentTarget.dataset.do;if(d==="fifteen")setTime(15);else if(d==="weak"){const t=data.topics.find(x=>x.status==="fragile");if(t)state.timer.subject=t.subject||t.name;setTime(5)}else setTime(5);start()}else if(a==="preset"){setTime(Number(e.currentTarget.dataset.m));render()}else if(a==="custom"){setTime(Math.max(1,Math.min(180,Number(document.getElementById("customMins").value)||25)));render()}else if(a==="start")start();else if(a==="pause")pause();else if(a==="finish")finish();else if(a==="reset"){pause();setTime(state.timer.mins);render()}else if(a==="preview")preview();else if(a==="reason"){state.reason=e.currentTarget.dataset.r;render()}else if(a==="review"){const t=data.topics.find(x=>x.id===e.currentTarget.dataset.id);if(t){t.reviewCount=(t.reviewCount||0)+1;t.lastReviewedAt=new Date().toISOString();if(t.status==="fragile")t.status="learning";save();show("Đã ghi một lần ôn lại.");render()}}else if(a==="quest")completeQuest(e.currentTarget.dataset.id);else if(a==="export")exportData();else if(a==="import")importData();else if(a==="reset")reset();else if(a==="save-settings")saveSettings();else if(a==="mascot-default"){data.settings.mascot=null;save();render()}else if(a==="fav"){const f=data.settings.favorites.find(x=>x.id===e.currentTarget.dataset.id);if(f){data.settings.mascot=f.image;save();show("Đã đổi mascot đồng hành.");render()}}else if(a==="cancel-crop"){state.crop={src:null,img:null,zoom:1,x:0,y:0};render()}else if(a==="apply-crop")applyCrop()}
    function setTime(m){pause();state.timer.mins=m;state.timer.left=m*60;state.timer.phase="focus";state.timer.subject=document.getElementById("subject")?.value||state.timer.subject;data.profile.preferred=m;save()}
    function start(){if(state.timer.run)return;state.timer.subject=document.getElementById("subject")?.value||state.timer.subject;state.timer.cycle=Boolean(document.getElementById("cycle")?.checked);state.timer.run=true;tick=setInterval(()=>{state.timer.left=Math.max(0,state.timer.left-1);if(state.timer.left===0)finish();else render()},1000);render()}
    function pause(){state.timer.run=false;clearInterval(tick)}
    function finish(){const t=state.timer,elapsed=Math.max(0,t.mins*60-t.left);pause();if(t.phase==="focus"&&elapsed){const eligible=!data.settings.noScore&&elapsed>=240;const award=eligible?Math.min(30,Math.max(5,Math.round(elapsed/300)*5)):0;data.sessions.push({id:id("session"),subject:t.subject,startedAt:new Date(Date.now()-elapsed*1000).toISOString(),endedAt:new Date().toISOString(),actualSeconds:elapsed,status:"completed",noScore:Boolean(data.settings.noScore),xpAwarded:award});save();show(eligible?`Đã lưu phiên học thật · +${award} XP.`:"Đã lưu phiên. XP chỉ áp dụng từ 4 phút để giữ công bằng.");if(t.cycle){t.phase="break";t.cycles++;t.mins=t.cycles%4===0?15:5;t.left=t.mins*60;render();return}}else if(t.phase==="break"){show("Khoảng nghỉ xong rồi. Khi sẵn sàng, mình bắt đầu vòng mới nhé.");t.phase="focus";t.mins=25;t.left=1500;render();return}setTime(t.phase==="focus"?t.mins:25);render()}
    function addTopic(e){e.preventDefault();const f=new FormData(e.currentTarget);data.topics.unshift({id:id("topic"),name:String(f.get("name")||"").trim(),subject:String(f.get("subject")||"").trim(),concept:String(f.get("concept")||"").trim(),formula:String(f.get("formula")||"").trim(),example:String(f.get("example")||"").trim(),status:"learning",reviewCount:0,createdAt:new Date().toISOString()});save();show("Đã thêm một mảnh kiến thức.");render()}
    function addMistake(e){e.preventDefault();const f=new FormData(e.currentTarget),topic=data.topics.find(t=>t.id===f.get("topic"));if(!topic)return;data.mistakes.push({id:id("mistake"),topicId:topic.id,reason:state.reason,createdAt:new Date().toISOString()});if(data.mistakes.filter(m=>m.topicId===topic.id).length>=2)topic.status="fragile";save();show("Đã lưu dấu vết. Sai có thể mở một Quest sửa lỗ hổng.");render()}
    function saveReflection(e){e.preventDefault();const s=p().sessions.slice().sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt))[0],f=new FormData(e.currentTarget);if(s){s.learned=String(f.get("learned")||"").trim();s.realized=String(f.get("realized")||"").trim();save();show("Đã cất một dòng phản chiếu.");render()}}
    function completeQuest(qid){const q=questList().find(x=>x.id===qid);if(!q||q.done)return;const note=prompt("Ong đã làm bước nào cho Quest này? (một dòng ngắn là đủ)");if(!note||!note.trim())return;data.quests.push({id:qid,done:true,note:note.trim().slice(0,240),xp:q.xp,completedAt:new Date().toISOString(),noScore:Boolean(data.settings.noScore)});save();show(data.settings.noScore?"Đã ghi nhận Quest ở chế độ học nhẹ.":`Đã hoàn thành Quest · +${q.xp} XP.`);render()}
    function preview(){stopSound();const type=document.getElementById("audio")?.value||data.settings.audio;if(type==="none"){show("Đang để không âm thanh.");return}try{audioCtx=new AudioContext();const gain=audioCtx.createGain();gain.gain.value=.055;gain.connect(audioCtx.destination);if(type==="tick"){let n=0;const int=setInterval(()=>{if(n++>7){clearInterval(int);stopSound();return}const o=audioCtx.createOscillator();o.frequency.value=900;o.connect(gain);o.start();o.stop(audioCtx.currentTime+.035)},380);noise={disconnect:()=>clearInterval(int)}}}catch{show("Trình duyệt chưa cho nghe thử âm thanh.");return}if(type!=="tick"){const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate),a=buf.getChannelData(0);let last=0;for(let i=0;i<a.length;i++){const white=Math.random()*2-1;last=type==="brown"?(last+.02*white)/1.02:white;a[i]=type==="library"?white*.34:type==="cafe"?(white*.5+Math.sin(i/2200)*.15):type==="rain"?white*.5:last}const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(gain);src.start();noise=src;setTimeout(stopSound,3000)}show(`Đang nghe thử: ${soundName[type]}.`)}
    function stopSound(){try{noise?.stop?.();noise?.disconnect?.();audioCtx?.close?.()}catch{}noise=null;audioCtx=null}
    function saveSettings(){data.profile.name=(document.getElementById("pName").value||"Ong").trim().slice(0,32);data.profile.currentSubject=(document.getElementById("pSubject").value||"").trim().slice(0,64);data.profile.goal=(document.getElementById("pGoal").value||"").trim().slice(0,120);data.profile.preferred=Math.max(1,Math.min(180,Number(document.getElementById("pPref").value)||25));data.profile.usualTime=(document.getElementById("pTime").value||"").trim().slice(0,64);data.settings.chatty=document.getElementById("pChatty").checked;data.settings.reduceMotion=document.getElementById("pMotion").checked;save();state.modal=null;show("Đã lưu hồ sơ local-first.");render()}
    function readMascot(e){const f=e.target.files?.[0];if(!f)return;if(!["image/png","image/jpeg","image/webp"].includes(f.type)||f.size>7*1024*1024){show("Hãy chọn PNG, JPG hoặc WebP dưới 7 MB nhé.");return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{state.crop={src:r.result,img:im,zoom:1,x:0,y:0};render()};im.src=r.result};r.readAsDataURL(f)}
    function applyCrop(){const im=state.crop.img;if(!im)return;const c=document.createElement("canvas"),size=256;c.width=c.height=size;const ctx=c.getContext("2d"),source=Math.min(im.naturalWidth,im.naturalHeight)/state.crop.zoom,maxX=(im.naturalWidth-source)/2,maxY=(im.naturalHeight-source)/2,sx=Math.max(0,Math.min(im.naturalWidth-source,(im.naturalWidth-source)/2+(state.crop.x/40)*maxX)),sy=Math.max(0,Math.min(im.naturalHeight-source,(im.naturalHeight-source)/2+(state.crop.y/40)*maxY));ctx.beginPath();ctx.arc(128,128,128,0,Math.PI*2);ctx.clip();ctx.drawImage(im,sx,sy,source,source,0,0,size,size);const out=c.toDataURL("image/webp",.82);if(valid(out)){data.settings.mascot=out;if(!data.settings.favorites.some(f=>f.image===out)&&data.settings.favorites.length<3)data.settings.favorites.unshift({id:id("mascot"),image:out});save();state.crop={src:null,img:null,zoom:1,x:0,y:0};show("Mascot mới đã được lưu vào bộ sưu tập.");render()}}
    function exportData(){data.settings.backupAt=new Date().toISOString();save();const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=`study-quest-${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);show("Đã xuất bản sao lưu JSON.");render()}
    function importData(){const i=document.createElement("input");i.type="file";i.accept="application/json";i.onchange=()=>{const f=i.files?.[0],r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));save();show("Đã khôi phục dữ liệu học của Ong.");render()}catch{show("Tệp này không phải bản sao lưu hợp lệ.")}};if(f)r.readAsText(f)};i.click()}
    function reset(){if(confirm("Làm mới toàn bộ dữ liệu Study Quest trong trình duyệt này? Hãy xuất JSON trước nếu Ong muốn cất hành trình.")){data=fresh();save();state.timer={mins:25,left:1500,run:false,phase:"focus",cycles:0,subject:"Toán"};show("Đã làm mới không gian học. Mình bắt đầu thật nhẹ nhé.");render()}}
    render();
  })();
  </script>
